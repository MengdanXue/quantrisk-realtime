[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantrisk-realtime"
version = "0.1.0"
description = "Real-time trading analytics (pricing, risk monitors, execution analytics, market-data adapters) extracted from a personal prototype; numerical correctness largely unverified"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Mengdan Xue"}]
requires-python = ">=3.10"
# Importing quantrisk_realtime.realtime pulls in its WebSocket router (fastapi) and
# the HTTP clients (aiohttp); everything else is optional.
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "aiohttp>=3.9", "fastapi>=0.110"]

[project.optional-dependencies]
stream = ["websockets>=12", "redis>=5", "prometheus_client>=0.19"]
observability = ["prometheus_client>=0.19", "opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]
ml = ["scikit-learn>=1.3", "xgboost>=2.0", "torch>=2.1", "arch>=6.2", "statsmodels>=0.14"]
data = ["akshare>=1.12", "ccxt>=4.2"]
alerts = ["aiosmtplib>=3.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-benchmark>=4", "hypothesis>=6.90", "httpx>=0.26",
       "websockets>=12", "redis>=5", "prometheus_client>=0.19", "sqlalchemy>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "performance: wall-clock benchmarks (tests/performance); machine-dependent, kept out of the correctness run with -m 'not performance'",
]
